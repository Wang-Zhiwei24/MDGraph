backend: cluster
scheduler: pbs
partition: cpu
fallback_partitions: [testcpu]
pbs_resources: nodes
# Use absolute executable paths if the cluster environment does not expose them on PATH.
command: [lmp]
mpi_launcher: [mpiexec, -launcher, fork]
nodes: 1
tasks: 32
cpus_per_task: 1
memory_gb: 4
walltime: "01:00:00"
production_walltime: "24:00:00"
timeout_seconds: 3600
poll_seconds: 20
max_watch_seconds: 1800
