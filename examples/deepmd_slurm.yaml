# Replace site/user/model paths explicitly. Paths to local artifacts are relative to this YAML.
name: carbon_deepmd_nvt
goal: Run an existing validated carbon DeePMD potential at 300 K and inspect trajectory stability.
structure:
  path: inputs/carbon.extxyz
  elements: [C]
potential:
  kind: deepmd
  model: inputs/graph.pb
  metadata: inputs/potential_metadata.json
  # plugin: inputs/libdeepmd_lmp.so   # only if required; must match remote LAMMPS ABI
protocol:
  ensemble: nvt
  temperature_k: 300
  timestep_fs: 0.5
  steps: 20000
  thermo_every: 100
  dump_every: 100
  tdamp_fs: 100
execution:
  backend: ssh
  scheduler: slurm
  host: cluster.example.org
  username: YOUR_USERNAME
  remote_root: /absolute/path/to/your/mdgraph_runs
  # key_filename: ~/.ssh/id_ed25519
  partition: gpu
  nodes: 1
  tasks: 1
  cpus_per_task: 4
  gpus: 1
  memory_gb: 16
  walltime: "02:00:00"
  command: [srun, lmp]
  setup:
    - "module load lammps-deepmd"  # administrator-provided setup; never generated by the LLM
  poll_seconds: 30
  max_watch_seconds: 14400
  max_retries: 1
llm:
  enabled: false
  # Set enabled=true and install .[llm] for role-based LLM planning/diagnosis/analysis.
  model: null
  base_url: null
  api_key_env: MDGRAPH_API_KEY

